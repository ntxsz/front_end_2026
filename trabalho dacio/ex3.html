<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Média Escolar</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background: #E31E76;
      padding: 30px;
      border-radius: 10px;
      width: 350px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 10px;
      border: none;
      background-color: #007bff;
      color: white;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }

    #resultado {
      margin-top: 20px;
      padding: 15px;
      border-radius: 5px;
      font-weight: bold;
      text-align: center;
    }

    .aprovado {
      background-color: #dbeafe;
      color: blue;
    }

    .exame {
      background-color: #dcfce7;
      color: green;
    }

    .reprovado {
      background-color: #fee2e2;
      color: red;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Média Nota Escolar </h1>

    <input type="text" id="nome" placeholder="Nome do aluno">

    <input type="number" id="nota1" placeholder="Nota 1" step="0.1">
    <input type="number" id="nota2" placeholder="Nota 2" step="0.1">
    <input type="number" id="nota3" placeholder="Nota 3" step="0.1">

    <button id="calcular">Calcular Média</button>

    <div id="resultado"></div>
  </div>

  <script>
    const botao = document.getElementById("calcular");

    botao.addEventListener("click", () => {

      const nome = document.getElementById("nome").value;

      const nota1 = Number(document.getElementById("nota1").value);
      const nota2 = Number(document.getElementById("nota2").value);
      const nota3 = Number(document.getElementById("nota3").value);

      const resultado = document.getElementById("resultado");

      const media = (nota1 + nota2 + nota3) / 3;

      let mensagem = "";

      if (media >= 7 && media <= 10) {

        mensagem = `
          ${nome}, sua média foi ${media.toFixed(2)}<br>
          Situação: APROVADO ✅
        `;

        resultado.className = "aprovado";

      } else if (media >= 4 && media < 7) {

        const falta = (10 - media).toFixed(2);

        mensagem = `
          ${nome}, sua média foi ${media.toFixed(2)}<br>
          Situação: EXAME 📝<br>
          Faltam ${falta} pontos para chegar em 10.
        `;

        resultado.className = "exame";

      } else {

        mensagem = `
          ${nome}, sua média foi ${media.toFixed(2)}<br>
          Situação: REPROVADO ❌
        `;

        resultado.className = "reprovado";
      }

      resultado.innerHTML = mensagem;
    });
  </script>

</body>
</html>
