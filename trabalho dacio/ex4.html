<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banco que deixa o NUbank no Chinelo</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background: #E31E76;
      padding: 30px;
      border-radius: 10px;
      width: 380px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #ffffff;
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 10px;
      margin-bottom: 5px;
    }

    input, select {
      width: 100%;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 10px;
      border: none;
      background-color: #2563eb;
      color: white;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #1d4ed8;
    }

    #resultado {
      margin-top: 20px;
      background-color: #eff6ff;
      padding: 15px;
      border-radius: 5px;
      line-height: 1.8;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Banco que deixa o NUbank no Chinelo </h1>

    <label for="bandeira">Bandeira do Cartão</label>
    <select id="bandeira">
      <option value="visa">Visa</option>
      <option value="master">Master</option>
      <option value="elo">Elo</option>
    </select>

    <label for="valor">Valor da Venda</label>
    <input type="number" id="valor" step="0.01" placeholder="Digite o valor">

    <label for="parcelas">Quantidade de Parcelas</label>
    <input type="number" id="parcelas" placeholder="Digite o número de parcelas">

    <button id="calcular">Calcular</button>

    <div id="resultado"></div>
  </div>

  <script>
    const botao = document.getElementById("calcular");

    botao.addEventListener("click", () => {

      const bandeira = document.getElementById("bandeira").value;
      const valor = Number(document.getElementById("valor").value);
      const parcelas = Number(document.getElementById("parcelas").value);

      const resultado = document.getElementById("resultado");

      let taxaPercentual = 0;

      // Taxa da bandeira
      switch (bandeira) {
        case "visa":
          taxaPercentual = 0.02;
          break;

        case "master":
          taxaPercentual = 0.0185;
          break;

        case "elo":
          taxaPercentual = 0.03;
          break;
      }

      // Cálculos
      const taxaBandeira = valor * taxaPercentual;

      // Juros simples
      const juros = valor * (0.015 * parcelas);

      // Taxa mensal fixa
      const taxaMensal = 12.50 * parcelas;

      // Valor total
      const valorTotal = valor + taxaBandeira + juros + taxaMensal;

      // Valor da parcela
      const valorParcela = valorTotal / parcelas;

      resultado.innerHTML = `
        <strong>Resumo da Venda:</strong><br><br>

        💰 Valor da Venda: R$ ${valor.toFixed(2)}<br>

        💳 Taxa da Bandeira: R$ ${taxaBandeira.toFixed(2)}<br>

        📈 Juros Totais: R$ ${juros.toFixed(2)}<br>

        🏦 Taxa Mensal: R$ ${taxaMensal.toFixed(2)}<br>

        📦 Quantidade de Parcelas: ${parcelas}x<br>

        ✅ Valor Total: R$ ${valorTotal.toFixed(2)}<br>

        🧾 Valor de Cada Parcela: R$ ${valorParcela.toFixed(2)}
      `;
    });
  </script>

</body>
</html>
